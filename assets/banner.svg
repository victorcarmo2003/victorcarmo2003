<svg width="700" height="150" viewBox="0 0 700 150" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code',Consolas,monospace">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fdbca"/>
      <stop offset="50%" stop-color="#c792ea"/>
      <stop offset="100%" stop-color="#ffeb95"/>
    </linearGradient>

    <clipPath id="p1clip">
      <rect x="208" y="75" width="0" height="30">
        <animate attributeName="width" dur="13.2s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.1212;0.2197;0.3030;1"
          values="0;233;233;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="p2clip">
      <rect x="208" y="75" width="0" height="30">
        <animate attributeName="width" dur="13.2s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.3333;0.4545;0.5530;0.6364;1"
          values="0;0;222;222;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="p3clip">
      <rect x="208" y="75" width="0" height="30">
        <animate attributeName="width" dur="13.2s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.6667;0.7879;0.8864;0.9697;1"
          values="0;0;287;287;0;0"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="698" height="148" rx="14" fill="#011627" stroke="url(#glow)" stroke-width="1.5"/>
  <rect x="1" y="1" width="698" height="34" rx="14" fill="#0b2942"/>
  <rect x="1" y="20" width="698" height="15" fill="#0b2942"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="350" y="23" text-anchor="middle" fill="#7fdbca" font-size="12" opacity="0.8">victor@github: ~</text>

  <g font-size="18">
    <text x="24" y="95"><tspan fill="#c792ea">victor@github</tspan><tspan fill="#7fdbca">:~$ </tspan></text>

    <text x="208" y="95" clip-path="url(#p1clip)" fill="#d6deeb">nmap -sV -p- 10.0.0.4</text>
    <text x="208" y="95" clip-path="url(#p2clip)" fill="#d6deeb">wireshark -k -i eth0</text>
    <text x="208" y="95" clip-path="url(#p3clip)" fill="#d6deeb">aircrack-ng capture-01.cap</text>
  </g>

  <rect y="78" width="9" height="24" fill="#7fdbca">
    <animate attributeName="x" dur="13.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.1212;0.2197;0.3030;0.3333;0.4545;0.5530;0.6364;0.6667;0.7879;0.8864;0.9697;1"
      values="208;441;441;208;208;430;430;208;208;495;495;208;208"/>
    <animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="1;0;1"/>
  </rect>
</svg>
